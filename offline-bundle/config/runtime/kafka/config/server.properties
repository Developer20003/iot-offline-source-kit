# Kafka 4.2.2 - Offline IoT Development Kit

process.roles=broker,controller
node.id=1

# KRaft single-node controller
controller.quorum.bootstrap.servers=127.0.0.1:9093
controller.listener.names=CONTROLLER

# Docker and local Windows connections
listeners=INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093

advertised.listeners=INTERNAL://iot-kafka:19092,EXTERNAL://127.0.0.1:9092

listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL

# Persistent data
log.dirs=/var/lib/kafka/data

# Single-node development
num.partitions=1
num.network.threads=2
num.io.threads=4

offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

log.retention.hours=168
